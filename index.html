<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="dark">
    <main id="app-viewport">
        <div id="unity-container">
            <canvas id="unity-canvas" tabindex="-1"></canvas>
            <div id="loading-cover">
                <div id="unity-loading-bar">
                    <div id="unity-logo"><img src="Images/logo.png" alt="Ricochet"></div>
                    <div id="unity-progress-bar-empty" hidden>
                        <div id="unity-progress-bar-full"></div>
                    </div>
                    <div class="spinner" aria-label="Loading"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/TelegramOptimized.loader.js";
        const config = {
            dataUrl: buildUrl + "/TelegramOptimized.data.unityweb",
            frameworkUrl: buildUrl + "/TelegramOptimized.framework.js.unityweb",
            codeUrl: buildUrl + "/TelegramOptimized.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Re.Games",
            productName: "Ricochet",
            productVersion: "1.0"
        };

        const root = document.documentElement;
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector(".spinner");
        let telegram = window.Telegram && window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;

        let unityInstance = null;
        let unityLoopPaused = false;
        let telegramInitialized = false;

        function setCssPixels(name, value) {
            root.style.setProperty(name, Math.max(0, Number(value) || 0) + "px");
        }

        function updateViewport() {
            const viewportHeight = telegram
                ? telegram.viewportStableHeight || telegram.viewportHeight || window.innerHeight
                : window.innerHeight;
            const insets = telegram
                ? telegram.contentSafeAreaInset || telegram.safeAreaInset
                : null;

            setCssPixels("--app-height", viewportHeight);
            setCssPixels("--safe-top", insets && insets.top);
            setCssPixels("--safe-right", insets && insets.right);
            setCssPixels("--safe-bottom", insets && insets.bottom);
            setCssPixels("--safe-left", insets && insets.left);
        }

        function setUnityPaused(paused) {
            if (!unityInstance || !unityInstance.Module || unityLoopPaused === paused)
                return;

            const action = paused ? "pauseMainLoop" : "resumeMainLoop";
            if (typeof unityInstance.Module[action] !== "function")
                return;

            unityInstance.Module[action]();
            unityLoopPaused = paused;
        }

        function setActive(active) {
            setUnityPaused(!active);
            if (active)
                canvas.focus();
        }

        function initializeTelegram() {
            telegram = window.Telegram && window.Telegram.WebApp
                ? window.Telegram.WebApp
                : null;

            if (!telegram || telegramInitialized) {
                updateViewport();
                return;
            }

            telegramInitialized = true;

            telegram.ready();
            telegram.expand();

            if (typeof telegram.setHeaderColor === "function")
                telegram.setHeaderColor("#000000");
            if (typeof telegram.setBackgroundColor === "function")
                telegram.setBackgroundColor("#000000");
            if (typeof telegram.setBottomBarColor === "function")
                telegram.setBottomBarColor("#000000");
            if (typeof telegram.disableVerticalSwipes === "function")
                telegram.disableVerticalSwipes();
            if (typeof telegram.lockOrientation === "function")
                telegram.lockOrientation();

            telegram.onEvent("viewportChanged", updateViewport);
            telegram.onEvent("safeAreaChanged", updateViewport);
            telegram.onEvent("contentSafeAreaChanged", updateViewport);
            telegram.onEvent("activated", () => setActive(true));
            telegram.onEvent("deactivated", () => setActive(false));
            updateViewport();
        }

        function loadTelegramSdk() {
            const script = document.createElement("script");
            script.src = "https://telegram.org/js/telegram-web-app.js";
            script.async = true;
            script.onload = initializeTelegram;
            script.onerror = updateViewport;
            document.head.appendChild(script);
        }

        document.addEventListener("contextmenu", event => event.preventDefault());
        document.addEventListener("visibilitychange", () => setActive(!document.hidden));
        window.addEventListener("resize", updateViewport);
        window.addEventListener("focus", () => setActive(true));
        window.addEventListener("blur", () => setActive(false));
        window.addEventListener("pointerdown", () => canvas.focus(), { passive: true });

        updateViewport();
        loadTelegramSdk();

        const loader = document.createElement("script");
        loader.src = loaderUrl;
        loader.onload = () => {
            createUnityInstance(canvas, config, progress => {
                spinner.hidden = true;
                progressBarEmpty.hidden = false;
                progressBarFull.style.width = `${100 * Math.max(progress, 0.05)}%`;
            }).then(instance => {
                unityInstance = instance;
                loadingCover.hidden = true;
                setActive(!document.hidden && (!telegram || telegram.isActive !== false));
            }).catch(error => {
                console.error(error);
            });
        };
        document.body.appendChild(loader);
    </script>
</body>
</html>
